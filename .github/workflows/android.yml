name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate bundled content
        run: |
          python3 tools/import_content.py
          git diff --exit-code -- app/src/main/assets
      - name: Test and build debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ContextoTO-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Decode release signing key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/contextoto-release.jks"
      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          export ANDROID_SIGNING_STORE_FILE="$RUNNER_TEMP/contextoto-release.jks"
          ./gradlew assembleRelease --no-daemon
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_flags=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then release_flags+=(--prerelease); fi
          gh release create "${GITHUB_REF_NAME}" app/build/outputs/apk/release/app-release.apk --title "ContextoTO ${GITHUB_REF_NAME}" --generate-notes "${release_flags[@]}"
